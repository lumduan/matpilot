# Serves the static export (out/) the way a plain static host would. Used by the `preview`
# target only. Production hosting configuration is outside this repository.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export writes /route as route.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Content-hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
