name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Next.js CLI telemetry (build machine only; the app itself sends nothing).
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build static export
        run: |
          pnpm build
          if [ ! -f out/index.html ]; then
            echo "::error file=next.config.ts::out/index.html was not produced by the static export"
            exit 1
          fi

  docker:
    name: Docker toolchain (ADR 0005)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that Dockerfile, .nvmrc and packageManager agree
        run: |
          node_version="$(tr -d '[:space:]' < .nvmrc)"
          pnpm_version="$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' package.json)"
          status=0
          if ! grep -q "^FROM node:${node_version}-" Dockerfile; then
            echo "::error file=Dockerfile::Node.js base image does not match .nvmrc (${node_version})"
            status=1
          fi
          if ! grep -q "^ARG PNPM_VERSION=${pnpm_version}$" Dockerfile; then
            echo "::error file=Dockerfile::PNPM_VERSION does not match packageManager (${pnpm_version})"
            status=1
          fi
          exit "$status"

      - name: Validate compose.yaml
        run: docker compose config --quiet

      - name: Check that every compose network pins one /24 outside Docker's default pools
        run: |
          status=0
          while IFS=$'\t' read -r name subnets; do
            count="$(wc -w <<< "$subnets")"
            if [ "$count" -ne 1 ] || [[ "$subnets" != */24 ]] \
              || [[ "$subnets" == 192.168.* ]] || [[ "$subnets" =~ ^172\.(1[6-9]|2[0-9]|3[01])\. ]]; then
              echo "::error file=compose.yaml::network '${name}' must pin exactly one /24 subnet outside 192.168.0.0/16 and 172.16.0.0/12 (found: '${subnets}')"
              status=1
            fi
          done < <(docker compose config --format json \
            | jq -r '.networks | to_entries[] | [.key, ([.value.ipam.config[]?.subnet] | join(" "))] | @tsv')
          exit "$status"

      - name: Lint, typecheck, test and build in the container
        run: |
          docker build --target export --output type=local,dest=out .
          if [ ! -f out/index.html ]; then
            echo "::error file=Dockerfile::out/index.html was not produced by the container build"
            exit 1
          fi
