# pnpm settings (pnpm 10+ reads settings from this file).
#
# pnpm 12 refuses packages published less than 24 hours ago (minimumReleaseAge), a supply-chain
# guard. No package is excluded from it. If a fresh release is genuinely needed, list it here under
# minimumReleaseAgeExclude with its exact version (never without one), together with the date after
# which the entry can be removed (CONTRIBUTING.md, "Dependencies").
